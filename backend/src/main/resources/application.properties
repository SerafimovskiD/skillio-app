spring.application.name=backend

# --- Database (override with environment variables if needed) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/skillio}
spring.datasource.username=${DB_USERNAME:skillio}
spring.datasource.password=${DB_PASSWORD:skillio}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Security ---
# Set JWT_SECRET in any real deployment (min. 32 bytes). The default is for local development only.
jwt.secret=${JWT_SECRET:skillio-dev-secret-key-change-me-in-production-32bytes-min}
jwt.expiration-ms=86400000

# --- AI service (embeddings) ---
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.timeout-seconds=30

# --- Recommendation weights (must sum to 1) ---
recommendation.weights.embedding=0.6
recommendation.weights.skills=0.3
recommendation.weights.category=0.1

# --- File upload (CV) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.cv.dir=uploads/cv
server.tomcat.max-swallow-size=-1

# --- Error responses: never expose stack traces to clients ---
spring.web.error.include-stacktrace=never