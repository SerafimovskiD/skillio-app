spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5433/skillio
spring.datasource.username=skillio
spring.datasource.password=skillio
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
