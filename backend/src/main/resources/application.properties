spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5433/skillio
spring.datasource.username=skillio
spring.datasource.password=skillio
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:skillio-dev-secret-key-change-me-in-production-32bytes-min}
jwt.expiration-ms=86400000


ai.service.url=http://localhost:8000
ai.service.timeout-seconds=30

recommendation.weights.embedding=0.6
recommendation.weights.skills=0.3
recommendation.weights.category=0.1

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.cv.dir=uploads/cv

server.tomcat.max-swallow-size=-1