services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: skillio
      POSTGRES_USER: skillio
      POSTGRES_PASSWORD: skillio
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  dbdata:
